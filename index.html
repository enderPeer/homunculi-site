<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homunculi Chatbots</title>
<meta name="description" content="Every Homunculi and Haishool chatbot, one link each.">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f1c; --muted: #66695f;
    --line: #e3dfd5; --accent: #2f5d46; --accent-ink: #ffffff; --soon: #a0a39a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151715; --card: #1e211e; --ink: #ecebe6; --muted: #a3a69c;
      --line: #2e322d; --accent: #7fbf9a; --accent-ink: #10140f; --soon: #5d6159;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151715; --card: #1e211e; --ink: #ecebe6; --muted: #a3a69c;
    --line: #2e322d; --accent: #7fbf9a; --accent-ink: #10140f; --soon: #5d6159;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; display: flex; gap: 16px; align-items: center;
  }
  .text { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .tag { font-size: 0.78rem; color: var(--muted); border: 1px solid var(--line);
         border-radius: 999px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }
  .desc { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
  a.open {
    flex: none; background: var(--accent); color: var(--accent-ink); text-decoration: none;
    font-weight: 600; padding: 9px 16px; border-radius: 8px; white-space: nowrap;
  }
  a.open:hover { filter: brightness(1.08); }
  a.open:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  span.open { flex: none; color: var(--soon); font-weight: 600; padding: 9px 4px; white-space: nowrap; }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
  @media (max-width: 480px) {
    li { flex-direction: column; align-items: stretch; }
    a.open { text-align: center; }
  }
</style>
</head>
<body>
<main>
  <h1>Homunculi chatbots</h1>
  <p class="lead">Small language models trained from scratch on our own machines in Berlin. Pick one; each chat opens in its own window.</p>
  <ul id="bots"></ul>
  <footer>Addresses can change when a server restarts; this page reads them from <a href="endpoint.json">endpoint.json</a>.</footer>
</main>
<script>
// Fallback list; endpoint.json "bots" replaces it when it loads.
var BOTS = [
  { id: "classic", name: "Homunculi Classic", tag: "v0.5",
    desc: "The character-level model, fine-tuned for chat. The most conversational one.",
    url: "https://handling-tumor-internship-chrome.trycloudflare.com/chat?model=old" },
  { id: "a002", name: "Homunculi A", tag: "0.0.2 chat · big run",
    desc: "The 24-hour training run (tokens, rotary positions), now fine-tuned for chat. About as good on facts as Classic.",
    url: "https://handling-tumor-internship-chrome.trycloudflare.com/chat?model=new" },
  { id: "haishool", name: "Haishool", tag: "4b · graph",
    desc: "Learns facts, not language: 3,000+ things linked into one graph. Ask what something is or how two things connect.",
    url: "https://enderpeer.github.io/haishool/chat.html" },
  { id: "haishool-links", name: "Haishool links explorer", tag: "4b",
    desc: "Walk the knowledge graph step by step from one thing to another.",
    url: "https://enderpeer.github.io/haishool/hops.html" },
  { id: "atoms", name: "Haishool Atoms", tag: "in training",
    desc: "Next Haishool: elements, atoms and chemistry from checked rules. Link appears when it is ready.",
    url: "" }
];

function render(bots) {
  var list = document.getElementById("bots");
  list.textContent = "";
  bots.forEach(function (b) {
    var li = document.createElement("li");
    var text = document.createElement("div");
    text.className = "text";
    var name = document.createElement("div");
    name.className = "name";
    name.textContent = b.name;
    if (b.tag) {
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = b.tag;
      name.appendChild(tag);
    }
    var desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = b.desc || "";
    text.appendChild(name);
    text.appendChild(desc);
    li.appendChild(text);
    var ok = typeof b.url === "string" && /^https?:\/\//.test(b.url);
    var btn = document.createElement(ok ? "a" : "span");
    btn.className = "open";
    if (ok) {
      btn.href = b.url;
      btn.target = "chat-" + b.id;   // one window per bot
      btn.rel = "noopener";
      btn.textContent = "Open chat";
    } else {
      btn.textContent = "Soon";
    }
    li.appendChild(btn);
    list.appendChild(li);
  });
}

render(BOTS);
fetch("endpoint.json", { cache: "no-store" })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (j) { if (j && Array.isArray(j.bots) && j.bots.length) render(j.bots); })
  .catch(function () {});
</script>
</body>
</html>
